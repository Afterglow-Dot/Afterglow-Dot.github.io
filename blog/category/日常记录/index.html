  (function () {
    var widget = document.getElementById('bgm-widget');
    var audio = document.getElementById('bgm-audio');
    var btn = document.getElementById('bgm-btn');
    var volInput = document.getElementById('bgm-vol');
    var muteBtn = document.getElementById('bgm-mute');
    if (!widget || !audio || !btn || !volInput || !muteBtn) return;

    var ON_KEY = 'bgm-on';
    var TIME_KEY = 'bgm-time';
    var VOL_KEY = 'bgm-vol';

    // 存储可能被隐私模式禁用，降级为空实现，避免整段脚本报错
    function safeStore(getter) {
      try {
        var s = getter.call(window);
        s.setItem('bgm-probe', '1');
        s.removeItem('bgm-probe');
        return s;
      } catch (e) {
        return { getItem: function () { return null; }, setItem: function () {} };
      }
    }
    var store = safeStore(function () { return window.sessionStorage; });
    var volStore = safeStore(function () { return window.localStorage; });

    // 音量：localStorage 优先；默认 0.4（这首 -13.7 LUFS，偏热）
    var savedVol = parseFloat(volStore.getItem(VOL_KEY));
    audio.volume = isNaN(savedVol) ? 0.4 : Math.min(1, Math.max(0, savedVol));
    if (audio.volume === 0) audio.muted = true;

    // iOS Safari 的 volume 是只读的：写进去读不回来。用回读做特性检测，
    // 检测不通过就隐藏滑块，只保留静音键（muted 在 iOS 上是有效的）。
    var canSetVolume = (function () {
      var before = audio.volume;
      var ok;
      audio.volume = 0.5;
      ok = Math.abs(audio.volume - 0.5) < 0.01;
      audio.volume = before;
      return ok;
    })();
    if (!canSetVolume) widget.classList.add('bgm-no-volume');

    // 已经在听的人：把整首预取进 HTTP 缓存，换页 seek 命中本地字节，
    // 重缓冲几乎消失。没听过的人保持 metadata，不浪费 3.5MB 带宽。
    if (store.getItem(ON_KEY) === '1') {
      audio.preload = 'auto';
    }

    var metaReady = false;

    // 按钮默认可见：iOS 常忽略 preload，元数据可能要等用户点击才加载，
    // 若把显示与否绑在 loadedmetadata 上，iPhone 上按钮会永远不出现。
    function onMeta() {
      if (metaReady) return;
      metaReady = true;
      var t = parseFloat(store.getItem(TIME_KEY) || '0');
      if (t > 0 && audio.duration && t < audio.duration - 1) {
        audio.currentTime = t; // 换页后接着上一页的进度
      }
    }

    audio.addEventListener('error', function () {
      widget.hidden = true;
      console.warn('[bgm] 音频加载失败，播放器已隐藏：' + (audio.currentSrc || audio.src));
    });

    function setPlaying(on) {
      btn.classList.toggle('is-playing', on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', on ? '暂停背景音乐' : '播放背景音乐');
      store.setItem(ON_KEY, on ? '1' : '0');
    }

    function play() {
      return audio
        .play()
        .then(function () {
          setPlaying(true);
        })
        .catch(function () {
          setPlaying(false); // 被自动播放策略拦截，等用户点按钮
        });
    }

    function resumeIfEnabled() {
      if (store.getItem(ON_KEY) === '1') play();
    }

    btn.addEventListener('click', function () {
      if (audio.paused) {
        play();
      } else {
        audio.pause();
        setPlaying(false);
      }
    });

    // 音量条：input 实时改音量，change（松手）才落盘，避免拖动时频繁写存储
    volInput.addEventListener('input', function () {
      var v = volInput.value / 100;
      audio.volume = v;
      audio.muted = v === 0;
    });
    volInput.addEventListener('change', function () {
      volStore.setItem(VOL_KEY, audio.volume);
    });

    muteBtn.addEventListener('click', function () {
      audio.muted = !audio.muted;
    });

    // 统一状态同步：拖滑块、点静音、系统静音都会走这里
    function syncVolumeUI() {
      var v = audio.muted ? 0 : audio.volume;
      volInput.value = Math.round(v * 100);
      muteBtn.setAttribute('aria-pressed', audio.muted ? 'true' : 'false');
      muteBtn.setAttribute('aria-label', audio.muted ? '取消静音' : '静音');
      muteBtn.textContent = audio.muted ? '🔇' : '🔊';
    }
    audio.addEventListener('volumechange', syncVolumeUI);
    // 显式同步一次：初值来自 localStorage，可能和 markup 里写死的 40 不同；
    // 且前面设 volume/muted 时监听器还没注册，那些事件的回调并不保证能收到。
    syncVolumeUI();

    // 记录进度：sessionStorage 按标签页隔离，关掉标签页即清空
    audio.addEventListener('timeupdate', function () {
      store.setItem(TIME_KEY, audio.currentTime.toFixed(1));
    });
    window.addEventListener('pagehide', function () {
      if (!audio.paused) store.setItem(TIME_KEY, audio.currentTime.toFixed(1));
      volStore.setItem(VOL_KEY, audio.volume);
    });

    // 兼容两种情况：元数据已就绪（命中缓存），或稍后才加载完
    audio.addEventListener('loadedmetadata', function () {
      onMeta();
      resumeIfEnabled();
    });
    if (audio.readyState >= 1) {
      onMeta();
      resumeIfEnabled();
    }
  })();
